<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cairn">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#C9634A"/>
      <stop offset="55%" stop-color="#B4573E"/>
      <stop offset="100%" stop-color="#9C4530"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="58%" stop-color="#F2E7D3"/>
      <stop offset="100%" stop-color="#DEC9AC"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5E2517" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#5E2517" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- full-bleed square: the platform applies its own mask -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- scale the stack to ~0.82 so it stays inside the maskable safe zone -->
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
    <ellipse cx="256" cy="382" rx="118" ry="20" fill="url(#contact)" filter="url(#soft)"/>
    <ellipse cx="261" cy="318" rx="92"  ry="17" fill="url(#contact)" filter="url(#soft)"/>
    <ellipse cx="251" cy="258" rx="68"  ry="14" fill="url(#contact)" filter="url(#soft)"/>
    <ellipse cx="259" cy="206" rx="46"  ry="12" fill="url(#contact)" filter="url(#soft)"/>

    <rect x="140" y="332" width="232" height="66" rx="30" fill="url(#stone)"/>
    <rect x="167" y="272" width="188" height="58" rx="27" fill="url(#stone)"/>
    <rect x="192" y="218" width="132" height="50" rx="24" fill="url(#stone)"/>
    <rect x="216" y="172" width="88"  height="42" rx="20" fill="url(#stone)"/>

    <g fill="#FFFFFF" opacity="0.5">
      <rect x="158" y="340" width="196" height="10" rx="5"/>
      <rect x="183" y="279" width="156" height="9"  rx="4.5"/>
      <rect x="206" y="224" width="104" height="8"  rx="4"/>
      <rect x="228" y="178" width="64"  height="7"  rx="3.5"/>
    </g>
  </g>
</svg>
