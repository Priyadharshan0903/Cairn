<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cairn">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#E0895F"/>
      <stop offset="52%" stop-color="#C96A45"/>
      <stop offset="100%" stop-color="#A94E36"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF9F1"/>
      <stop offset="100%" stop-color="#F1E7D6"/>
    </linearGradient>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5E2517" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- full-bleed square: the platform applies its own mask -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- flame scaled to ~0.82 so it stays inside the maskable safe zone -->
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
    <g transform="translate(118 112) scale(3.0)" filter="url(#cast)">
      <path d="M46 4 C64 30 84 40 84 68 A38 38 0 1 1 8 68 C8 48 22 44 28 30 C34 46 40 44 44 36 C50 46 46 54 40 58 C48 60 54 54 54 46 C66 54 70 60 70 70 A24 24 0 1 1 22 70 C22 56 34 52 46 4 Z" fill="url(#flame)"/>
    </g>
  </g>
</svg>
